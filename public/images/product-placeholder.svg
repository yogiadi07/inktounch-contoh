<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Product Box Icon -->
  <g transform="translate(75, 75)">
    <!-- Box Base -->
    <rect x="20" y="80" width="110" height="70" fill="#ffd700" stroke="#333" stroke-width="2"/>
    
    <!-- Box Top -->
    <polygon points="20,80 50,50 160,50 130,80" fill="#ffed4e" stroke="#333" stroke-width="2"/>
    
    <!-- Box Side -->
    <polygon points="130,80 160,50 160,120 130,150" fill="#fbbf24" stroke="#333" stroke-width="2"/>
    
    <!-- Product Label -->
    <rect x="30" y="90" width="80" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">PRODUK</text>
    <text x="70" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">GAMBAR</text>
  </g>
  
  <!-- Camera Icon -->
  <g transform="translate(120, 200)">
    <circle cx="30" cy="20" r="25" fill="#6b7280" stroke="#374151" stroke-width="2"/>
    <circle cx="30" cy="20" r="15" fill="#9ca3af"/>
    <circle cx="30" cy="20" r="8" fill="#374151"/>
    <rect x="15" y="5" width="30" height="8" rx="4" fill="#374151"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Gambar Produk</text>
</svg>
